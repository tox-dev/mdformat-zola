name: 🧪 check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "7 8 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    name: 🧪 test
    if: github.event_name != 'schedule' || github.repository_owner == 'tox-dev'
    uses: tox-dev/github-workflows/.github/workflows/check.yaml@13381289334b15375958be7f7438f3c3d860e575 # 6.5.5
    permissions:
      contents: read
    with:
      os: ubuntu-24.04
      include: |
        [
          {"env": "3.15"},
          {"env": "3.14", "python": "3.14"},
          {"env": "3.13", "python": "3.13"},
          {"env": "3.12", "python": "3.12"},
          {"env": "3.11", "python": "3.11"},
          {"env": "3.15", "os": "windows-2025"},
          {"env": "3.14", "python": "3.14", "os": "windows-2025"},
          {"env": "3.13", "python": "3.13", "os": "windows-2025"},
          {"env": "3.12", "python": "3.12", "os": "windows-2025"},
          {"env": "3.11", "python": "3.11", "os": "windows-2025"},
          {"env": "dev"},
          {"env": "dev", "os": "windows-2025"},
          {"env": "type"},
          {"env": "type", "os": "windows-2025"},
          {"env": "pkg_meta"},
          {"env": "pkg_meta", "os": "windows-2025"}
        ]
  release:
    name: 🏷️ Release dry run
    uses: ./.github/workflows/prepare-release.yaml # zizmor: ignore[self-repository] actionlint rejects the $/ form
    permissions:
      contents: read
      pull-requests: read
    with:
      dry-run: true
  hooks:
    name: 🧹 Hooks under the cooldown
    uses: tox-dev/github-workflows/.github/workflows/cooled-hooks.yaml@0c4cffd63033d38196319524d101caae1eef925b # 6.7.2
    permissions:
      contents: read
  gate:
    name: 🚦 ${{ github.event_name == 'pull_request' && 'Required checks pass' || 'Non-PR checks pass' }}
    if: ${{ !cancelled() }} # codespell:ignore cancelled
    needs: [test, release, hooks]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: 🚦 Require all needed jobs to pass
        uses: tox-dev/github-workflows/required-checks@13381289334b15375958be7f7438f3c3d860e575 # 6.5.5
        with:
          needs: ${{ toJSON(needs) }}
