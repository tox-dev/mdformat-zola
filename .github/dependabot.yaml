version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - dependencies
      - github_actions
      - skip news
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "pre-commit"
    directory: "/"
    allow:
      - dependency-name: mdformat-gfm
      - dependency-name: mdformat-gfm-alerts
      - dependency-name: mdformat-footnote
      - dependency-name: mdformat-front-matters
      - dependency-name: mdformat-deflist
    labels:
      - dependencies
      - skip news
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7
