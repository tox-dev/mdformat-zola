default_language_version:
  python: python3.15
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
        additional_dependencies:
          - "ruamel-yaml==0.19.1" # release-creator managed
      - id: trailing-whitespace
        additional_dependencies:
          - "ruamel-yaml==0.19.1" # release-creator managed
      - id: file-contents-sorter
        files: "^.gitignore$"
        additional_dependencies:
          - "ruamel-yaml==0.19.1" # release-creator managed
      - id: check-case-conflict
        additional_dependencies:
          - "ruamel-yaml==0.19.1" # release-creator managed
      - id: check-added-large-files
        additional_dependencies:
          - "ruamel-yaml==0.19.1" # release-creator managed
  - repo: https://github.com/rhysd/actionlint
    rev: "914e7df21a07ef503a81201c76d2b11c789d3fca" # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell
  - repo: https://github.com/tox-dev/tox-toml-fmt
    rev: "5125f601c3e134347288c3d42f3b34298b7cf1be" # frozen: v1.11.1
    hooks:
      - id: tox-toml-fmt
        additional_dependencies:
          - "tox-toml-fmt==1.11.1" # release-creator managed
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "50e0f3aee9dc5747a5f173f79a7417403c18dda6" # frozen: v2.30.3
    hooks:
      - id: pyproject-fmt
        additional_dependencies:
          - "pyproject-fmt==2.30.3" # release-creator managed
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "38bfb07c0c64c304f47eb52090f8288150c77730" # frozen: v0.17.1
    hooks:
      - id: ruff-format
        additional_dependencies:
          - "ruff==0.17.1" # release-creator managed
      - id: ruff-check
        args: ["--fix", "--unsafe-fixes", "--exit-non-zero-on-fix"]
        additional_dependencies:
          - "ruff==0.17.1" # release-creator managed
  - repo: https://github.com/google/yamlfmt
    rev: "21ca5323a9c87ee37a434e0ca908efc0a89daa07" # frozen: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/hukkin/mdformat
    rev: "82912cdaea4fb830f751504486a7879c70526547" # frozen: 1.0.0
    hooks:
      - id: mdformat
        args: ["--wrap=120"]
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-gfm-alerts==2.1.0
          - mdformat-footnote==0.1.3
          - mdformat-front-matters==2.0.0
          - mdformat-deflist==0.1.4
          - "markdown-it-py==4.2.0" # release-creator managed
          - "mdit-py-plugins==0.6.1" # release-creator managed
          - "mdurl==0.1.2" # release-creator managed
          - "ruamel-yaml==0.19.1" # release-creator managed
          - "toml==0.10.2" # release-creator managed
          - "wcwidth==0.9.2" # release-creator managed
        exclude: "^tests/fixtures/"
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor
        additional_dependencies:
          - "zizmor==1.31.1" # release-creator managed
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
